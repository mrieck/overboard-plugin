<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="title">
      <span class="dot"></span>
      <h1>Overboard</h1>
    </div>
    <div class="actions">
      <span id="status" class="status"></span>
      <button id="rescan" class="btn ghost" title="Re-scan local clones">Rescan</button>
      <button id="refresh" class="btn">Refresh</button>
    </div>
  </header>

  <main id="cards" class="cards">
    <p class="empty">Loading…</p>
  </main>

  <div id="overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <h2 id="detail-title">—</h2>
        <button id="detail-close" class="btn ghost">Close</button>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="tab-body" class="tab-body"></div>
    </div>
  </div>

  <script src="vendor/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
