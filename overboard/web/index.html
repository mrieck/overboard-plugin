<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar">
      <header id="sidebar-head">
        <div class="title">
          <span class="dot"></span>
          <h1>Overboard</h1>
        </div>
        <div class="actions">
          <button id="settings" class="btn ghost small" title="Settings — sources & tokens">⚙</button>
          <button id="rescan" class="btn ghost small" title="Re-scan local clones">Rescan</button>
          <button id="refresh" class="btn small">Refresh</button>
        </div>
      </header>
      <div id="status" class="status"></div>
      <div id="project-list" class="project-list">
        <p class="empty">Loading…</p>
      </div>
    </aside>

    <main id="detail" class="detail">
      <div class="detail-empty">Select a project on the left.</div>
    </main>

    <aside id="context" class="context">
      <div class="context-head">
        <h2>Direction</h2>
        <button id="context-toggle" class="btn ghost small" title="Collapse / expand">›</button>
      </div>
      <div id="context-body" class="context-body"></div>
    </aside>
  </div>

  <script src="vendor/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
