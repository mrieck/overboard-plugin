<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overboard</title>
  <link rel="stylesheet" href="vendor/highlight-theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="banners"></div>
  <div class="layout">
    <!-- Thin far-left rail: Projects · Scheduler · Plugins, Settings at the
         bottom (panels.js renders it). Scheduler/Plugins take the full width
         to the right of the strip; Projects shows the three panes below. -->
    <nav id="strip" aria-label="Panels"></nav>

    <div id="panel-projects" class="panel">
      <aside id="sidebar">
        <header id="sidebar-head">
          <div class="title">
            <h1>Overboard</h1>
          </div>
          <div class="actions">
            <button id="rescan" class="btn ghost small" title="Re-scan local clones">Rescan</button>
            <button id="refresh" class="btn small">Refresh</button>
          </div>
        </header>
        <div id="status" class="status"></div>
        <div id="project-list" class="project-list">
          <p class="empty">Loading…</p>
        </div>
      </aside>

      <main id="detail" class="detail">
        <div class="detail-empty">Select a project on the left.</div>
      </main>

      <aside id="context" class="context">
        <div class="context-head">
          <h2>Direction</h2>
          <button id="context-toggle" class="btn ghost small" title="Collapse / expand">›</button>
        </div>
        <div id="context-body" class="context-body"></div>
      </aside>
    </div>

    <section id="panel-scheduler" class="panel panel-host" hidden></section>
    <section id="panel-plugins" class="panel panel-host" hidden></section>
  </div>

  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="celebrate.js"></script>
  <script src="panels.js"></script>
  <script src="promptfield.js"></script>
  <script src="scheduler.js"></script>
  <script src="slot_editor.js"></script>
  <script src="run_detail.js"></script>
  <script src="dispatch.js"></script>
  <script src="plugins.js"></script>
  <script src="app.js"></script>
</body>
</html>
